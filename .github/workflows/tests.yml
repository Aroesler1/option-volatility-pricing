name: tests

on:
  push:
    branches: [main, alt-data]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # torch comes from the CPU-only index: the GPU wheel is several gigabytes
      # and nothing here needs it. Everything else is what the tests import
      # directly; the vendor clients (yfinance, databento, psycopg2, pyarrow)
      # are deliberately absent, because no test is allowed to reach a vendor.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scipy scikit-learn requests
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      # The suite is deliberately offline: no test reads a vendor API, a
      # database, or a credential. Anything needing licensed data is exercised
      # against fixtures instead, so CI proves the logic without proving that
      # a secret was configured.
      - name: Run tests
        run: python -m pytest tests -q
